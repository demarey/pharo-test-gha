name: Pharo CI

on:
  workflow_call:
    inputs:
      pharo-version:
        description: "Pharo version to test, e.g. 11, 12, or 13"
        required: true
        type: string

      export-image-name:
        description: "Name of the clean image to export (empty = no export)"
        required: false
        default: ""
        type: string

      metacello-baseline:
        description: "Metacello baseline to load"
        required: false
        default: "MyProject"
        type: string

      metacello-repository:
        description: "Metacello repository path (local path relative to checkout, e.g. 'src')"
        required: false
        default: "src"
        type: string

      test-packages:
        description: "Packages to test"
        required: false
        default: ""
        type: string

      test-fail-on-error:
        description: "Fail the job if tests fail"
        required: false
        default: "true"
        type: string

      test-artifact-name:
        description: "Input only used by tests to generate unique artifact names"
        required: false
        type: string
        default: "test-results"

      checkout-repository:
        description: "Owner/repo to checkout for the project under test (e.g. 'demarey/Soup'). Empty = checkout the calling repo"
        required: false
        type: string
        default: ""

jobs:
  build-test:
    runs-on: ubuntu-latest

    env:
      PHARO_IMAGE_NAME: ${{ inputs.export-image-name != '' && inputs.export-image-name || 'Pharo' }}

    strategy:
      fail-fast: false

    steps:
      - name: Resolve default branch for checkout
        id: resolve-branch
        if: inputs.checkout-repository != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ inputs.checkout-repository }}
        run: |
          DEFAULT_BRANCH=$(gh api "repos/$REPO" --jq .default_branch)
          echo "branch=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.checkout-repository != '' && inputs.checkout-repository || github.repository }}
          ref: ${{ steps.resolve-branch.outputs.branch || github.sha }}
          fetch-depth: 0

      - name: Setup Pharo
        uses: pharo-project/pharo-setup-gha@main
        with:
          version: ${{ inputs.pharo-version }}
          imageName: ${{ env.PHARO_IMAGE_NAME }}
      
      - name: Load project with Metacello (and save clean image)
        run: |
          # Force numeric conversion
          PHARO_VERSION=$(( ${{ inputs.pharo-version }} ))

          if [ "$PHARO_VERSION" -ge 14 ]; then
            PROJECT_NAME="${{ inputs.metacello-baseline }}"
          else
            PROJECT_NAME="BaselineOf${{ inputs.metacello-baseline }}"
          fi
          echo "Loading project $PROJECT_NAME"

          # Use local checkout instead of remote repository
          REPO_PATH="${{ github.workspace }}/${{ inputs.metacello-repository }}"
          
          $PHARO --headless "$PHARO_IMAGE_NAME".image metacello \
            install "gitlocal:///${REPO_PATH}" "$PROJECT_NAME" \
            --save

      - name: Export clean image
        if: ${{ inputs.export-image-name != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.export-image-name }}-${{ inputs.pharo-version }}
          path: |
            ${{ inputs.export-image-name }}.image
            ${{ inputs.export-image-name }}.changes
            *.sources

      - name: Run tests
        run: |
          $PHARO --headless "$PHARO_IMAGE_NAME".image test \
            --junit-xml-output \
            ${{ inputs.test-packages }} \
            ${{ inputs.test-fail-on-error == 'true' && '--fail-on-failure' || '' }}

      - name: Archive test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.test-artifact-name }}-${{ inputs.pharo-version }}
          path: ./*.xml

      - name: Publish unified report
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: (!cancelled())
        with:
          check_name: "Test Results (${{ github.event.workflow_run.event || github.event_name }})"
          files: "**/*.xml"
