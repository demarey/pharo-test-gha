name: Test Single Version

on:
  workflow_dispatch:

jobs:
  test-single:
    uses: ../pharo-build.yml
    with:
      pharo-version: 13
      export-image-name: "TestImage"
      metacello-baseline: "Soup"
      metacello-repository: "github://pharo-contributions/Soup/src"

  assert:
    needs: test-single
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TestImage-13
      - run: |
          test -f TestImage.image
          test -f TestImage.changes

      - uses: actions/download-artifact@v4
        with:
          name: test-results-13
      - run: test -f test-results.xml

